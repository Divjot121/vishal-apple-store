<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="titaniumBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c2c2e"/>
      <stop offset="50%" stop-color="#1c1c1e"/>
      <stop offset="100%" stop-color="#121214"/>
    </linearGradient>
    <linearGradient id="edgeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9a24a" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#555558" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2c2c2e" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="60%" stop-color="#0a0a0c"/>
      <stop offset="100%" stop-color="#141418"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#c9a24a" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#a67c2e" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <filter id="subtleDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Ambient Glow Behind Device -->
  <circle cx="300" cy="400" r="260" fill="url(#amberGlow)" filter="blur(40px)"/>

  <!-- Phone Body Outer Frame (Titanium) -->
  <rect x="130" y="80" width="340" height="640" rx="56" fill="url(#titaniumBg)" stroke="url(#edgeGlow)" stroke-width="3" filter="url(#subtleDrop)"/>

  <!-- Inner Display Bezel -->
  <rect x="142" y="92" width="316" height="616" rx="46" fill="#020202" stroke="#222225" stroke-width="1.5"/>

  <!-- Display Screen -->
  <rect x="146" y="96" width="308" height="608" rx="42" fill="url(#screenGrad)"/>

  <!-- Screen Wallpaper Geometric Aura -->
  <circle cx="300" cy="380" r="160" fill="none" stroke="#c9a24a" stroke-opacity="0.25" stroke-width="1"/>
  <circle cx="300" cy="380" r="110" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
  <circle cx="300" cy="380" r="60" fill="none" stroke="#c9a24a" stroke-opacity="0.3" stroke-width="1.5"/>
  <path d="M220 520 C 270 420, 330 420, 380 520" fill="none" stroke="#c9a24a" stroke-opacity="0.2" stroke-width="2"/>

  <!-- Dynamic Island -->
  <rect x="250" y="112" width="100" height="28" rx="14" fill="#000000" stroke="#1c1c1e" stroke-width="1"/>
  <circle cx="328" cy="126" r="4.5" fill="#0c101c"/>
  <circle cx="328" cy="126" r="1.5" fill="#1b3058"/>

  <!-- Antenna Lines -->
  <line x1="130" y1="200" x2="134" y2="200" stroke="#555558" stroke-width="2"/>
  <line x1="466" y1="200" x2="470" y2="200" stroke="#555558" stroke-width="2"/>

  <!-- Home Indicator Bar -->
  <rect x="245" y="688" width="110" height="4" rx="2" fill="#ffffff" fill-opacity="0.4"/>
</svg>
