<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="plugBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c2c30"/>
      <stop offset="100%" stop-color="#141416"/>
    </linearGradient>
    <filter id="plugGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <circle cx="300" cy="300" r="220" fill="#c9a24a" fill-opacity="0.08" filter="blur(35px)"/>

  <!-- Adapter Block -->
  <g filter="url(#plugGlow)">
    <rect x="200" y="180" width="200" height="240" rx="36" fill="url(#plugBody)" stroke="#44444a" stroke-width="2"/>
    <!-- USB-C Port 1 -->
    <rect x="250" y="240" width="100" height="24" rx="12" fill="#020202" stroke="#c9a24a" stroke-width="1.5"/>
    <rect x="260" y="249" width="80" height="6" rx="3" fill="#303036"/>
    <!-- USB-C Port 2 -->
    <rect x="250" y="295" width="100" height="24" rx="12" fill="#020202" stroke="#c9a24a" stroke-width="1.5"/>
    <rect x="260" y="304" width="80" height="6" rx="3" fill="#303036"/>
    <!-- Power Specs Print -->
    <text x="300" y="365" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#888890" text-anchor="middle">35W DUAL USB-C</text>
    <text x="300" y="385" font-family="-apple-system, sans-serif" font-size="10" fill="#c9a24a" text-anchor="middle">POWER ADAPTER</text>
  </g>
</svg>
