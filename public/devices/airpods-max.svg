<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="metalSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a4a50"/>
      <stop offset="50%" stop-color="#242428"/>
      <stop offset="100%" stop-color="#141416"/>
    </linearGradient>
    <filter id="headShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <circle cx="300" cy="350" r="240" fill="#c9a24a" fill-opacity="0.07" filter="blur(40px)"/>

  <!-- Headband Arc -->
  <path d="M 180 340 C 180 120, 420 120, 420 340" fill="none" stroke="#2a2a2e" stroke-width="24" stroke-linecap="round"/>
  <!-- Canopy Mesh -->
  <path d="M 210 240 C 240 180, 360 180, 390 240" fill="none" stroke="#3d3d44" stroke-width="8" stroke-dasharray="2,3"/>

  <!-- Left Telescoping Arm -->
  <rect x="172" y="320" width="16" height="60" rx="8" fill="#5a5a60"/>
  <!-- Right Telescoping Arm -->
  <rect x="412" y="320" width="16" height="60" rx="8" fill="#5a5a60"/>

  <!-- Left Ear Cup -->
  <g filter="url(#headShadow)">
    <rect x="130" y="350" width="100" height="150" rx="46" fill="url(#metalSilver)" stroke="#44444a" stroke-width="2"/>
    <rect x="144" y="364" width="72" height="122" rx="36" fill="#1b1b1e" stroke="#2a2a2e" stroke-width="1.5"/>
  </g>

  <!-- Right Ear Cup -->
  <g filter="url(#headShadow)">
    <rect x="370" y="350" width="100" height="150" rx="46" fill="url(#metalSilver)" stroke="#44444a" stroke-width="2"/>
    <rect x="384" y="364" width="72" height="122" rx="36" fill="#1b1b1e" stroke="#2a2a2e" stroke-width="1.5"/>
    <!-- Digital Crown & Noise Button -->
    <rect x="440" y="340" width="14" height="22" rx="3" fill="#c9a24a" stroke="#8c6a28" stroke-width="1"/>
    <rect x="390" y="338" width="28" height="6" rx="3" fill="#3a3a40"/>
  </g>
</svg>
