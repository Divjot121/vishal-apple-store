<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="puckAlu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3c3c40"/>
      <stop offset="100%" stop-color="#1c1c1e"/>
    </linearGradient>
    <filter id="puckGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <circle cx="300" cy="300" r="220" fill="#c9a24a" fill-opacity="0.08" filter="blur(35px)"/>

  <!-- Braided Cable -->
  <path d="M 300 390 C 300 480, 220 540, 140 570" fill="none" stroke="#2c2c30" stroke-width="12" stroke-linecap="round"/>
  <path d="M 300 390 C 300 480, 220 540, 140 570" fill="none" stroke="#c9a24a" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="3,4"/>

  <!-- MagSafe Magnetic Disc -->
  <g filter="url(#puckGlow)">
    <!-- Outer Metal Bezel -->
    <circle cx="300" cy="270" r="120" fill="url(#puckAlu)" stroke="#55555c" stroke-width="2"/>
    <!-- Soft Touch Charging Face -->
    <circle cx="300" cy="270" r="108" fill="#141416" stroke="#25252a" stroke-width="1.5"/>
    <!-- Magnetic Ring Graphic -->
    <circle cx="300" cy="270" r="70" fill="none" stroke="#c9a24a" stroke-opacity="0.4" stroke-width="3" stroke-dasharray="8,6"/>
    <circle cx="300" cy="270" r="20" fill="#0d0d0f" stroke="#c9a24a" stroke-opacity="0.6" stroke-width="1.5"/>
  </g>
</svg>
