<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="podCase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f2f2f5"/>
      <stop offset="100%" stop-color="#d8d8de"/>
    </linearGradient>
    <linearGradient id="podStem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e2e8"/>
    </linearGradient>
    <filter id="podDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <circle cx="300" cy="300" r="220" fill="#c9a24a" fill-opacity="0.08" filter="blur(35px)"/>

  <!-- Charging Case -->
  <g filter="url(#podDrop)">
    <!-- Case Body -->
    <rect x="180" y="240" width="240" height="190" rx="60" fill="url(#podCase)" stroke="#d0d0d6" stroke-width="1.5"/>
    <!-- Lid Seam -->
    <line x1="180" y1="300" x2="420" y2="300" stroke="#bebec4" stroke-width="1"/>
    <!-- Status LED -->
    <circle cx="300" cy="340" r="3.5" fill="#c9a24a"/>
    <!-- Lanyard Loop -->
    <rect x="415" y="325" width="6" height="30" rx="3" fill="#b0b0b6"/>
  </g>

  <!-- Left Earbud (Floating) -->
  <g transform="translate(130, 80) rotate(-15)" filter="url(#podDrop)">
    <!-- Head -->
    <ellipse cx="60" cy="50" rx="35" ry="30" fill="url(#podStem)"/>
    <!-- Silicone Tip -->
    <ellipse cx="35" cy="50" rx="20" ry="18" fill="#e8e8ed" stroke="#d5d5dc" stroke-width="1"/>
    <!-- Black Mesh Vent -->
    <ellipse cx="70" cy="45" rx="8" ry="5" fill="#1c1c1e"/>
    <!-- Stem -->
    <rect x="55" y="70" width="16" height="60" rx="8" fill="url(#podStem)"/>
    <rect x="58" y="118" width="10" height="10" rx="4" fill="#c9a24a" fill-opacity="0.8"/>
  </g>

  <!-- Right Earbud (Floating) -->
  <g transform="translate(370, 80) rotate(15)" filter="url(#podDrop)">
    <ellipse cx="60" cy="50" rx="35" ry="30" fill="url(#podStem)"/>
    <ellipse cx="85" cy="50" rx="20" ry="18" fill="#e8e8ed" stroke="#d5d5dc" stroke-width="1"/>
    <ellipse cx="50" cy="45" rx="8" ry="5" fill="#1c1c1e"/>
    <rect x="49" y="70" width="16" height="60" rx="8" fill="url(#podStem)"/>
    <rect x="52" y="118" width="10" height="10" rx="4" fill="#c9a24a" fill-opacity="0.8"/>
  </g>
</svg>
