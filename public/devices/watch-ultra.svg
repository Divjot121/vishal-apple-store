<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="ultraTitanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#46464a"/>
      <stop offset="50%" stop-color="#2c2c30"/>
      <stop offset="100%" stop-color="#1e1e22"/>
    </linearGradient>
    <filter id="watchShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <circle cx="300" cy="375" r="230" fill="#c9a24a" fill-opacity="0.08" filter="blur(35px)"/>

  <!-- Rugged Alpine Loop Band Top -->
  <path d="M 230 40 L 370 40 L 350 210 L 250 210 Z" fill="#2d3036" stroke="#1c1c1f" stroke-width="2"/>
  <line x1="240" y1="90" x2="360" y2="90" stroke="#ff6a00" stroke-width="3" stroke-dasharray="10,8"/>
  <line x1="244" y1="140" x2="356" y2="140" stroke="#ff6a00" stroke-width="3" stroke-dasharray="10,8"/>

  <!-- Band Bottom -->
  <path d="M 250 540 L 350 540 L 370 710 L 230 710 Z" fill="#2d3036" stroke="#1c1c1f" stroke-width="2"/>
  <line x1="246" y1="610" x2="354" y2="610" stroke="#ff6a00" stroke-width="3" stroke-dasharray="10,8"/>
  <line x1="240" y1="660" x2="360" y2="660" stroke="#ff6a00" stroke-width="3" stroke-dasharray="10,8"/>

  <!-- Watch Casing -->
  <g filter="url(#watchShadow)">
    <!-- Titanium Case -->
    <rect x="180" y="210" width="240" height="330" rx="60" fill="url(#ultraTitanium)" stroke="#585860" stroke-width="2.5"/>

    <!-- Left Orange Action Button -->
    <rect x="166" y="320" width="14" height="64" rx="6" fill="#ff6a00" stroke="#cc5500" stroke-width="1.5"/>

    <!-- Right Crown Guard & Digital Crown -->
    <path d="M 420 280 L 442 290 L 442 420 L 420 430 Z" fill="#323236"/>
    <!-- Digital Crown with Orange Ring -->
    <rect x="428" y="300" width="22" height="65" rx="6" fill="#1e1e20" stroke="#505058" stroke-width="1.5"/>
    <circle cx="439" cy="332" r="6" fill="#ff6a00"/>
    <!-- Side Button -->
    <rect x="428" y="380" width="16" height="35" rx="4" fill="#28282c"/>

    <!-- Flat Sapphire Crystal Screen -->
    <rect x="202" y="232" width="196" height="286" rx="44" fill="#020204" stroke="#1a1a1e" stroke-width="2"/>

    <!-- Wayfinder Dial Graphic -->
    <circle cx="300" cy="375" r="75" fill="none" stroke="#c9a24a" stroke-width="1.5" stroke-dasharray="3,6"/>
    <circle cx="300" cy="375" r="50" fill="none" stroke="#ff6a00" stroke-width="1.5"/>
    <text x="300" y="360" font-family="-apple-system, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">09:41</text>
    <text x="300" y="390" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#c9a24a" letter-spacing="2" text-anchor="middle">AMRITSAR 31°N</text>
    <text x="300" y="415" font-family="-apple-system, sans-serif" font-size="10" fill="#888890" text-anchor="middle">72 BPM · ULTRA</text>
  </g>
</svg>
