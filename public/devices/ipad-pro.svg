<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 800" width="100%" height="100%">
  <defs>
    <linearGradient id="ipadEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a3a3e"/>
      <stop offset="50%" stop-color="#1e1e22"/>
      <stop offset="100%" stop-color="#141416"/>
    </linearGradient>
    <linearGradient id="ipadScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080a"/>
      <stop offset="100%" stop-color="#16161c"/>
    </linearGradient>
    <filter id="padShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="350" cy="400" r="280" fill="#c9a24a" fill-opacity="0.06" filter="blur(40px)"/>

  <!-- iPad Frame -->
  <rect x="110" y="70" width="480" height="660" rx="40" fill="url(#ipadEdge)" stroke="#444448" stroke-width="2" filter="url(#padShadow)"/>

  <!-- Black Border -->
  <rect x="122" y="82" width="456" height="636" rx="32" fill="#000000"/>

  <!-- Liquid Retina Screen -->
  <rect x="128" y="88" width="444" height="624" rx="28" fill="url(#ipadScreen)"/>

  <!-- Artwork Screen Lines -->
  <circle cx="350" cy="400" r="140" fill="none" stroke="#c9a24a" stroke-opacity="0.25" stroke-width="1.5"/>
  <ellipse cx="350" cy="400" rx="190" ry="110" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <path d="M 220 540 Q 350 320 480 540" fill="none" stroke="#c9a24a" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Landscape Camera / Face ID Sensor -->
  <circle cx="350" cy="98" r="3.5" fill="#1b2a4a"/>

  <!-- Home Indicator -->
  <rect x="290" y="698" width="120" height="4" rx="2" fill="#ffffff" fill-opacity="0.4"/>
</svg>
