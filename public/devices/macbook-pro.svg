<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="macBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2a2e"/>
      <stop offset="100%" stop-color="#141416"/>
    </linearGradient>
    <linearGradient id="macScreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050507"/>
      <stop offset="70%" stop-color="#0a0a0e"/>
      <stop offset="100%" stop-color="#18181f"/>
    </linearGradient>
    <filter id="macGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="35" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Ambient Light -->
  <ellipse cx="400" cy="380" rx="340" ry="120" fill="#c9a24a" fill-opacity="0.08" filter="blur(50px)"/>

  <!-- Screen Lid -->
  <g filter="url(#macGlow)">
    <rect x="150" y="80" width="500" height="330" rx="20" fill="url(#macBody)" stroke="#444448" stroke-width="1.5"/>
    <rect x="162" y="92" width="476" height="306" rx="10" fill="#020203"/>
    <rect x="164" y="94" width="472" height="302" rx="8" fill="url(#macScreen)"/>

    <!-- Display Wallpaper Geometric Grid -->
    <circle cx="400" cy="245" r="90" fill="none" stroke="#c9a24a" stroke-opacity="0.3" stroke-width="1.5"/>
    <ellipse cx="400" cy="245" rx="140" ry="60" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
    <path d="M 280 320 Q 400 180 520 320" fill="none" stroke="#c9a24a" stroke-opacity="0.25" stroke-width="2"/>

    <!-- Display Camera Notch -->
    <path d="M 376 94 H 424 V 104 Q 424 108 420 108 H 380 Q 376 108 376 104 Z" fill="#000000"/>
    <circle cx="400" cy="101" r="2.5" fill="#1b2a4a"/>
  </g>

  <!-- Laptop Base Chassis -->
  <g>
    <!-- Hinge -->
    <rect x="300" y="408" width="200" height="8" rx="2" fill="#1e1e20"/>
    <!-- Lower Base -->
    <polygon points="100,430 700,430 740,460 60,460" fill="url(#macBody)" stroke="#3a3a3e" stroke-width="1"/>
    <!-- Front Opening Notch -->
    <rect x="360" y="430" width="80" height="6" rx="3" fill="#18181a"/>
    <!-- Feet -->
    <rect x="110" y="458" width="50" height="4" rx="2" fill="#0d0d0f"/>
    <rect x="640" y="458" width="50" height="4" rx="2" fill="#0d0d0f"/>
  </g>
</svg>
